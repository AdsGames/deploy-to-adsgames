name: "Sync A.D.S. Games manifest"
description: "Sync a game's leaderboards and achievements (adsgames.json) to the A.D.S. Games play service. Runs on Linux runners."

inputs:
  project-id:
    description: "A.D.S. Games game slug, e.g. mini-jim"
    required: true
  manifest:
    description: "Path to the manifest. The action does nothing when it does not exist"
    required: false
    default: adsgames.json
  api-key:
    description: "A.D.S. Games API key. Dry runs are skipped with a warning when it is empty"
    required: false
    default: ""
  environments:
    description: "Space separated play environments to sync, dev and/or prod"
    required: false
    default: "dev prod"
  dry-run:
    description: "Check the manifest and report what a sync would change, without saving or uploading icons"
    required: false
    default: "false"
  workload-identity-provider:
    description: "Full resource name of the GitHub OIDC workload identity provider"
    required: false
    default: "projects/324306161120/locations/global/workloadIdentityPools/github/providers/github-actions"
  service-account:
    description: "Service account to impersonate for icon uploads"
    required: false
    default: "adsgames-games-deploy@foxd-io.iam.gserviceaccount.com"

runs:
  using: "composite"
  steps:
    # Icons are uploaded to the game bucket, dry runs upload nothing
    - name: Authenticate to Google Cloud
      if: inputs.dry-run != 'true' && hashFiles(inputs.manifest) != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Set up Cloud SDK
      if: inputs.dry-run != 'true' && hashFiles(inputs.manifest) != ''
      uses: google-github-actions/setup-gcloud@v3
      with:
        skip_install: true

    - name: Sync manifest
      shell: bash
      run: ${{ github.action_path }}/sync.sh
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        MANIFEST: ${{ inputs.manifest }}
        API_KEY: ${{ inputs.api-key }}
        ENVIRONMENTS: ${{ inputs.environments }}
        DRY_RUN: ${{ inputs.dry-run }}
