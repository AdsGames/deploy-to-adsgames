name: "Deploy to A.D.S. Games"
description: "Deploy files to storage bucket, and send a release message. Runs on Linux runners."

inputs:
  project-id:
    description: "A.D.S. Games Game Name"
    required: true
  version:
    description: "Version to release, defaults to the pushed tag or git describe"
    required: false
  workload-identity-provider:
    description: "Full resource name of the GitHub OIDC workload identity provider"
    required: false
    default: "projects/324306161120/locations/global/workloadIdentityPools/github/providers/github-actions"
  service-account:
    description: "Service account to impersonate for bucket uploads"
    required: false
    default: "adsgames-games-deploy@foxd-io.iam.gserviceaccount.com"
  build-dir:
    description: "Folder to upload"
    required: true
    default: build/
  platform:
    description: "Game platform, one of WEB, WINDOWS, LINUX or MAC"
    required: true
  api-key:
    description: "A.D.S. Games API key"
    required: true
  entry:
    description: "Entry point for web builds"
    required: false
    default: index.html

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        # Use the gcloud preinstalled on GitHub-hosted runners
        skip_install: true

    - name: Deploy game
      shell: bash
      run: ${{ github.action_path }}/deploy.sh
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
        PROJECT_ID: ${{ inputs.project-id }}
        ENTRY: ${{ inputs.entry }}
        BUILD_DIR: ${{ inputs.build-dir }}
        API_KEY: ${{ inputs.api-key }}
